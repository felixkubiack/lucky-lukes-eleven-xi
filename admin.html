<div id="toast" class="toast"></div><div id="pink" class="pink"></div><div id="noticePanel" class="notice-panel"></div><div id="permission" class="permission"><h3>Benachrichtigungen aktivieren?</h3><p class="muted">Erlaube Benachrichtigungen für neue Vereinsmitteilungen.</p><button class="btn primary" onclick="enableNotifications()">Aktivieren</button> <button class="btn" onclick="dismissPermission()">Später</button></div><header><div class="head"><div id="brand" class="brand"><img class="brand-logo" src="wappen.webp" alt=""><span class="brand-copy">Lucky Luke's Eleven XI<small id="sub">Spielerportal</small></span></div><div id="nav" class="nav"></div></div></header><div id="joinWrap" class="wrap hidden"><div class="join"><div id="joinForm" class="card"><h1>Lucky Lukes XI beitreten</h1><div class="grid"><label>Gamer-Tag<input id="jName"><span class="field-error">Bitte vervollständige deinen Gamer-Tag.</span></label><label>Position<select id="jPos"><option value="">Bitte wählen</option><option>TW</option><option>IV</option><option>LV</option><option>RV</option><option>LM</option><option>ZM</option><option>RM</option><option>OM</option><option>FL</option><option>ST</option></select><span class="field-error">Bitte wähle deine Position.</span></label><label>Alter<input id="jAge" type="number" min="1" max="99" placeholder="z. B. 18"><span class="field-error">Bitte vervollständige dein Alter.</span></label></div><button class="btn primary" style="width:100%;margin-top:13px" onclick="submitJoin()">Beitreten</button></div><div id="joinState"></div></div></div><main id="app" class="wrap hidden"><section id="home" class="page active"></section><section id="sessions" class="page"></section><section id="polls" class="page"></section><section id="lineup" class="page"></section><section id="rights" class="page"></section><section id="applications" class="page"></section><section id="history" class="page"></section><section id="community" class="page"></section><section id="profile" class="page"></section></main><div id="lineupModal" class="modal" onclick="if(event.target===this)closeLineupModal()"><div class="sheet"><h3 id="modalTitle">Spieler</h3><div id="modalOptions" class="option-grid"></div><button class="btn" style="width:100%;margin-top:10px" onclick="closeLineupModal()">Schließen</button></div></div><footer>Lucky Luke’s Eleven XI · Vereinsportal</footer>
